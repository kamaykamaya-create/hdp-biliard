name: Build APK HDP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil isi repository
        uses: actions/checkout@v4

      - name: Ekstrak proyek dari file zip (jika diunggah sebagai zip)
        run: |
          if [ ! -f settings.gradle ]; then
            ZIP=$(ls *.zip 2>/dev/null | head -n 1 || true)
            if [ -z "$ZIP" ]; then echo "File zip proyek belum diunggah ke repository."; exit 1; fi
            echo "Mengekstrak $ZIP"
            unzip -o -q "$ZIP" -d proyek_tmp
            SRC=$(dirname "$(find proyek_tmp -name settings.gradle | head -n 1)")
            cp -r "$SRC"/. .
          fi

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Unggah hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: HDP-APK
          path: app/build/outputs/apk/debug/*.apk
